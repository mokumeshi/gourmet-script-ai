<html lang="ja">
<head>

<style>

</head><body><main>

<div class="note">28秒・1280×720・素材画像なしのCanvas 2D。時間を動かすと一時停止します。</div>

(()=>{'use strict';

path(c=>{c.moveTo(-s*.84,-s*.04);c.quadraticCurveTo(-s*.26,-s*.78,s*.25,-s*.49);c.quadraticCurveTo(s*.86,-s*.60,s*.81,-s*.04)},null,'#ffe38a',s*.20);

function mound(cx,cy,rx,h,ry,amount=1,golden=1,ingredients=true){

const edge=Math.sqrt(Math.max(0,1-g.x*g.x));const top=h*(.86+.085*Math.sin(g.x*13)+.055*Math.cos(g.x*27));

path(c=>{c.moveTo(-315,0);c.bezierCurveTo(-284,122,-193,158,0,155);c.bezierCurveTo(189,154,277,108,315,0);c.closePath()},grad(0,0,0,157,[[0,'#5b6757'],[.5,'#344738'],[.88,'#28392f'],[1,'#8a8e71']]),'#293a2e',4);

function oil(t){ellipse(0,24,180,34,'rgba(225,186,75,.22)');path(c=>c.ellipse(-55,16,121,23,-.09,Math.PI*.9,Math.PI*1.8),null,'rgba(239,216,123,.56)',2);for(let i=0;i<10;i++)ellipse(-150+i*32,31+Math.sin(i*4+t*5)*9,1.8,1.2,'#e5c575')}
function rawEgg(t){const p=prog(t,2.91,3.5),cook=prog(t,3.6,5.1);if(p<=0)return;

function steam(t,cx=640,cy=405,intensity=1){ctx.save();ctx.lineCap='round';for(let i=0;i<9;i++){const p=((t*.22+i*.117)%1),x=cx-171+i*43+Math.sin(t*1.4+i)*13,y=cy-p*193;const a=Math.sin(Math.PI*p)*.28*intensity;path(c=>{c.moveTo(x,y);c.bezierCurveTo(x-20,y-24,x+19,y-33,x-2,y-57);c.bezierCurveTo(x-18,y-72,x+15,y-88,x+8,y-102)},null,`rgba(255,247,211,${a})`,8*(1-p)+2)}ctx.restore()}

function sauce(t){if(t<12||t>13.2)return;let enter=prog(t,12,12.2),leave=prog(t,12.95,13.2);let x=825,y=228-120*(1-enter)-160*leave;hand(x+81,y-20,-.2,1,.7);line([[x+14,y],[x+110,y-33]],'#aaad8e',11);ellipse(x,y,43,19,'#bbbda1','#5b6651',3);ellipse(x-9,y+4,25,9,'#603721');if(t>12.25&&t<12.95)path(c=>{c.moveTo(x-37,y+6);c.bezierCurveTo(x-66,y+25,730,365,735,447)},null,'#8f572b',4)}
const tossTimes=[14.2,15.85,17.5,19.15];
function tossState(t){for(const at of tossTimes){const p=(t-at)/1.05;if(p>-.2&&p<1){const q=clamp(p),height=Math.sin(q*Math.PI),draw=Math.sin(clamp((p+.2)/1.2)*Math.PI);return{p,amount:height,x:640+draw*40,y:444-draw*42,rot:draw*.14}}}return{p:-1,amount:0,x:640,y:444,rot:0}}
function kitchenScene(t){background(t);const pan=tossState(t);fire(t,pan.amount*.8);wokBase(pan.x,pan.y,pan.rot);
ctx.save();ctx.translate(pan.x,pan.y);ctx.rotate(pan.rot);oil(t);
if(t<5.2){ctx.globalAlpha=1-prog(t,4.25,5.2);rawEgg(t);ctx.globalAlpha=1}if(t>4.2&&t<9.5)scrambled(t);
const riceAmount=prog(t,7.35,9.7);if(riceAmount>0)mound(0,12,232,57,46,riceAmount,prog(t,12,14.4),t>10.65);
ctx.restore();
rim(pan.x,pan.y,pan.rot);
if(t>3.25)steam(t,pan.x,pan.y-30,prog(t,3.25,6));
if(t<4.1)crackEgg(t);
if((t>4.0&&t<7.0)||(t>12.8&&t<14.1))spatula(t);
pourRice(t);pourIngredients(t);sauce(t);
if(t>13.65)hand(pan.x+464,pan.y-76+pan.rot*340,-.30+pan.rot,1,.85);
}
function plate(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ellipse(0,29,327,64,'rgba(61,36,21,.3)');path(c=>{c.moveTo(-326,0);c.quadraticCurveTo(-290,89,0,84);c.quadraticCurveTo(297,84,328,0)},'#c0c7af','#63765d',3);ellipse(0,0,330,94,'#f2ead0','#737d67',3);ellipse(0,-1,284,66,'#dce1c5','#a9b394',2);path(c=>c.ellipse(0,-2,307,81,0,.12,Math.PI-.12),null,'#eee4c5',5);for(let i=0;i<2;i++){path(c=>c.ellipse(0,0,316-i*8,87-i*4,0,0,TAU),null,'#a15d43',1.7)}ctx.restore()}
function plating(t){background(t,true);const p=prog(t,21.1,23.5),enter=prog(t,20.5,21.15),leave=prog(t,23.55,24.1),px=715,py=531;plate(px,py);mound(px,py-9,230,115,49,p);
if(t<24.1){let x=mix(329,423,enter)-leave*540,y=213-leave*180,rot=.60+enter*.22;wokBase(x,y,rot,.79,false);ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(.79,.79);mound(0,8,232,62,48,1-p);ctx.restore();rim(x,y,rot,.79);
for(let i=0;i<340;i++){const g=grains[i],birth=21.13+i/340*1.93,u=(t-birth)/.4;if(u<=0||u>=1)continue;const sx=x+205,sy=y+151;grain(mix(sx,px+g.x*183,u),mix(sy,py-82+g.v*90,u*u),g.s,g.type,g.a+u*3,g.c)}}steam(t,px,py-92,.8)}
function hero(t){background(t,true);const push=1.28+prog(t,24,27.6)*.18;ctx.save();ctx.translate(640,425);ctx.scale(push,push);ctx.translate(-640,-425);plate(640,501,1.09);mound(640,486,251,106,48,1);
// A few cut scallions settle on the crown.
for(let i=0;i<18;i++){const g=grains[i];let q=clamp((t-24.2-i*.026)/.7);if(t>24.2+i*.026)grain(640+g.x*110,390+(1-q)*-148+g.v*28,g.s*1.05,'green',g.a+q*2,g.c)}
steam(t,640,411,1);
// Off-centre highlights read as oil on individual rice grains.
for(let i=0;i<5;i++){const shine=Math.sin(Math.PI*clamp((t-24.7-i*.47)/.45));if(shine<=0)continue;let x=527+i*53,y=390+(i%2)*26;ctx.globalAlpha=shine*.7;line([[x-4,y],[x+4,y]],'#fff8cb',1.7);ctx.globalAlpha=1}ctx.restore();
}
function renderAt(seconds){const t=clamp(seconds,0,DURATION-.001);drawTime=t;ctx.resetTransform();ctx.clearRect(0,0,1280,720);ctx.lineJoin='round';ctx.lineCap='round';if(t<20.5)kitchenScene(t);else if(t<24)plating(t);else hero(t);
// Subtle warm edge shading; the food remains bright.
const v=ctx.createRadialGradient(620,378,280,640,360,770);v.addColorStop(0,'rgba(36,35,22,0)');v.addColorStop(1,'rgba(36,35,22,.20)');ctx.fillStyle=v;ctx.fillRect(0,0,1280,720);
}
function stageAt(t){return t<4?'卵を割る':t<7?'卵をほぐす':t<10?'ご飯を入れる':t<12?'具材を加える':t<14?'味付け・混ぜる':t<20.5?'鍋を振る':t<24?'皿に盛り付ける':'完成'}
const play=document.getElementById('play'),seek=document.getElementById('seek'),stage=document.getElementById('stage');
function show(){renderAt(clock);seek.value=String(clock);stage.textContent=stageAt(clock)+' '+clock.toFixed(1)+'秒'}
function setPlaying(v){playing=v;play.textContent=v?'一時停止':'再生'}
function frame(now){if(last&&playing)clock=(clock+Math.min((now-last)/1000,.1))%DURATION;last=now;show();requestAnimationFrame(frame)}
play.addEventListener('click',()=>setPlaying(!playing));document.getElementById('restart').addEventListener('click',()=>{clock=0;setPlaying(true)});seek.addEventListener('input',()=>{clock=Number(seek.value);setPlaying(false);show()});
document.getElementById('save').addEventListener('click',()=>{const a=document.createElement('a');a.download='fried-rice-'+clock.toFixed(2)+'.png';a.href=canvas.toDataURL('image/png');a.click()});
window.FriedRice={renderAt,duration:DURATION,stageAt};show();requestAnimationFrame(frame);
})();
</script></body></html>
